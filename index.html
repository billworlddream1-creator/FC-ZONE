
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST & FURIOUS CHAT ZONE (FC ZONE)</title>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "@google/genai": "https://esm.sh/@google/genai",
    "react-easy-crop": "https://esm.sh/react-easy-crop@5.2.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        nitro: {
                            cyan: '#00f3ff',
                            magenta: '#ff003c',
                            green: '#39ff14',
                            yellow: '#fbff00',
                            black: '#0a0a0c',
                            gray: '#15151a'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        inter: ['Inter', 'sans-serif']
                    },
                    keyframes: {
                        'nitro-shake': {
                            '0%, 100%': { transform: 'translate(0, 0)' },
                            '10%, 30%, 50%, 70%, 90%': { transform: 'translate(-2px, -2px)' },
                            '20%, 40%, 60%, 80%': { transform: 'translate(2px, 2px)' },
                        },
                        'drag-race': {
                            '0%': { transform: 'translateX(-100%)', opacity: '0' },
                            '10%': { opacity: '1' },
                            '90%': { opacity: '1' },
                            '100%': { transform: 'translateX(200%)', opacity: '0' }
                        },
                        'drift-arc': {
                            '0%': { transform: 'translate(-100%, 50%) rotate(-45deg)', opacity: '0' },
                            '50%': { transform: 'translate(50%, 0%) rotate(0deg)', opacity: '1' },
                            '100%': { transform: 'translate(200%, -50%) rotate(45deg)', opacity: '0' }
                        },
                        'smoke-rise': {
                            '0%': { transform: 'translateY(20px) scale(0.5)', opacity: '0' },
                            '50%': { opacity: '0.4' },
                            '100%': { transform: 'translateY(-100px) scale(2)', opacity: '0' }
                        },
                        'flicker': {
                            '0%, 18%, 22%, 25%, 53%, 57%, 100%': { opacity: '1', filter: 'brightness(1.2) drop-shadow(0 0 10px var(--nitro-primary))' },
                            '20%, 24%, 55%': { opacity: '0.3', filter: 'brightness(0.5) drop-shadow(0 0 0px var(--nitro-primary))' }
                        }
                    },
                    animation: {
                        'nitro-shake': 'nitro-shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
                        'drag-race': 'drag-race 2s linear forwards',
                        'drift-arc': 'drift-arc 2.5s ease-in-out forwards',
                        'smoke-rise': 'smoke-rise 3s ease-out forwards',
                        'flicker': 'flicker 2s infinite'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --nitro-primary: #00f3ff;
            --nitro-accent: #ff003c;
            --app-bg: #0a0a0c;
            --panel-bg: rgba(21, 21, 26, 0.7);
        }

        .light {
            --nitro-primary: #0070f3;
            --nitro-accent: #e00000;
            --app-bg: #ffffff;
            --panel-bg: rgba(240, 240, 245, 0.8);
        }

        .theme-red {
            --nitro-primary: #ff003c;
            --nitro-accent: #00f3ff;
        }

        @keyframes neon-glow {
            0%, 100% { text-shadow: 0 0 10px var(--nitro-primary), 0 0 20px rgba(0, 243, 255, 0.2); }
            50% { text-shadow: 0 0 20px var(--nitro-primary), 0 0 40px rgba(0, 243, 255, 0.4); }
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        @keyframes speed-blur {
            0% { filter: blur(0px); opacity: 1; transform: scale(1); }
            50% { filter: blur(4px); opacity: 0.8; transform: scale(1.02); }
            100% { filter: blur(0px); opacity: 1; transform: scale(1); }
        }

        .nitro-boost-active {
            animation: speed-blur 0.3s ease-in-out;
        }

        .neon-primary { color: var(--nitro-primary); }
        .bg-nitro-primary { background-color: var(--nitro-primary); }
        .border-nitro-primary { border-color: var(--nitro-primary); }
        .shadow-nitro-primary { box-shadow: 0 0 15px var(--nitro-primary); }

        .glass-panel { background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1) sepia(100%) saturate(10000%) hue-rotate(40deg);
            cursor: pointer;
        }

        .fab-pulse::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--nitro-primary);
            animation: pulse-ring 2s infinite;
            z-index: -1;
        }

        .status-glow-online { box-shadow: 0 0 10px #39ff14; }
        .status-glow-speeding { box-shadow: 0 0 10px #00f3ff; }

        body { background-color: var(--app-bg); transition: background-color 0.3s ease; }
    </style>
</head>
<body class="text-gray-200 dark:text-gray-200 font-inter h-screen overflow-hidden">
    <div id="root"></div>
</body>
</html>
