    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        nitro: {
                            cyan: '#00f3ff',
                            magenta: '#ff003c',
                            green: '#39ff14',
                            yellow: '#fbff00',
                            black: '#0a0a0c',
                            gray: '#15151a'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        inter: ['Inter', 'sans-serif']
                    },
                    keyframes: {
                        'nitro-shake': {
                            '0%, 100%': { transform: 'translate(0, 0)' },
                            '10%, 30%, 50%, 70%, 90%': { transform: 'translate(-2px, -2px)' },
                            '20%, 40%, 60%, 80%': { transform: 'translate(2px, 2px)' },
                        },
                        'drag-race': {
                            '0%': { transform: 'translateX(-100%)', opacity: '0' },

                            '100%': { transform: 'translate(200%, -50%) rotate(45deg)', opacity: '0' }
                        },
                        'flicker': {

                    animation: {
                        'nitro-shake': 'nitro-shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
                        'drag-race': 'drag-race 2s linear forwards',

                        'flicker': 'flicker 2s infinite'
                    }
                }
            }
        }
